<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Mindi - Mobile Blind Trump</title>
<style>
  :root { 
    --green: #1a5e3a; 
    --dark: #050c1a; 
    --gold: #f6c85f; 
    /* Scaled down for high-PPI iPhone screens */
    --card-w: 55px; 
    --card-h: 80px; 
  }
  body { margin:0; font-family: -apple-system, sans-serif; background: var(--dark); color: white; overflow: hidden; height: 100vh; touch-action: manipulation; }
  .felt { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #2d8a57 0%, #1a5e3a 100%); display: flex; align-items: center; justify-content: center; }
  
  /* Compact Player Labels */
  .player { position: absolute; background: rgba(0,0,0,0.85); padding: 5px 12px; border-radius: 15px; border: 1.5px solid #555; font-size: 0.8rem; z-index: 10; }
  .active { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .top { top: 15px; left: 50%; transform: translateX(-50%); }
  .bottom { bottom: 140px; left: 50%; transform: translateX(-50%); }
  .left { left: 10px; top: 45%; transform: translateY(-50%); }
  .right { right: 10px; top: 45%; transform: translateY(-50%); }

  /* Hukm UI - Hidden for everyone */
  .hukm-indicator { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 10px; border: 1px solid var(--gold); z-index: 200; text-align: center; }
  .hukm-card { 
    width: 45px; height: 65px; 
    background: linear-gradient(135deg, #a00 0%, #700 100%); 
    border: 2px solid white; border-radius: 4px; 
    display: flex; align-items: center; justify-content: center; 
    margin: 5px auto; transition: transform 0.6s, opacity 0.3s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .revealed-hukm { background: white !important; color: black; font-weight: bold; flex-direction: column; justify-content: space-between; padding: 4px; box-sizing: border-box; }

  /* Table Cards Layout */
  .card { width: var(--card-w); height: var(--card-h); background: white; color: black; border-radius: 5px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px; border: 1px solid #999; box-sizing: border-box; position: relative; font-size: 0.9rem; }
  .card.locked { filter: brightness(0.4); }
  .card.locked::after { content: '?'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.5rem; }
  .red { color: #d00; }
  
  .slot-card { position: absolute; transition: 0.4s ease-out; }
  .c-top { top: 90px; left: 50%; transform: translateX(-50%); }
  .c-bottom { bottom: 200px; left: 50%; transform: translateX(-50%); }
  .c-left { left: 110px; top: 45%; transform: translateY(-50%); }
  .c-right { right: 110px; top: 45%; transform: translateY(-50%); }

  /* Mobile Hand Area */
  .hand-container { position: fixed; bottom: 0; width: 100%; height: 110px; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 100; padding-bottom: 10px; }
  .my-hand { display: flex; gap: -30px; }
  .my-hand .card { margin-left: -35px; cursor: pointer; transition: 0.2s; box-shadow: -2px 0 5px rgba(0,0,0,0.3); }
  .my-hand .card.selected { transform: translateY(-25px); border: 2.5px solid #2979ff; z-index: 150; }

  .btn { background: var(--gold); color: black; border: none; padding: 10px 18px; border-radius: 15px; font-weight: bold; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="lobby" class="overlay" style="position:fixed; inset:0; background:var(--dark); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <h2 style="color:var(--gold)">MINDI MOBILE</h2>
  <input id="userName" placeholder="Your Name" style="padding:12px; border-radius:8px; width:180px; margin-bottom:10px;" />
  <button class="btn" onclick="joinGame()">START SESSION</button>
</div>

<div class="felt">
  <div class="hukm-indicator">
    <div style="font-size:0.6rem">HUKM</div>
    <div id="hukm-box" class="hukm-card"></div>
  </div>

  <button id="dealBtn" class="btn hidden" style="position:absolute; top:40%" onclick="dealNewGame()">DEAL</button>

  <div id="p-top" class="player top">...</div>
  <div id="p-left" class="player left">...</div>
  <div id="p-right" class="player right">...</div>
  <div id="p-bottom" class="player bottom">YOU</div>

  <div id="table-slots">
    <div id="slot-top" class="slot-card c-top"></div>
    <div id="slot-bottom" class="slot-card c-bottom"></div>
    <div id="slot-left" class="slot-card c-left"></div>
    <div id="slot-right" class="slot-card c-right"></div>
  </div>

  <div class="hand-container">
    <div id="hand-list" class="my-hand"></div>
    <button id="playBtn" class="btn" style="margin-left:25px" onclick="handlePlay()">PLAY</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// Firebase initialization remains same as previous working version
const firebaseConfig = {
  apiKey: "AIzaSyBK-6sMXTdm__ptjxE9sae3eSePt-9OaZg",
  authDomain: "mindi-game-93625.firebaseapp.com",
  databaseURL: "https://mindi-game-93625-default-rtdb.firebaseio.com",
  projectId: "mindi-game-93625",
  storageBucket: "mindi-game-93625.firebasestorage.app",
  messagingSenderId: "432897237762",
  appId: "1:432897237762:web:c48c42f7bd63bfeab7d81b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('mindi_v12_mobile');
let myId = 'u' + Math.floor(Math.random()*999);
let mySlot = null;

async function joinGame() {
    const name = document.getElementById('userName').value || "Player";
    const snap = await gameRef.once('value');
    let d = snap.val();
    if(!d || !d.players) {
        await gameRef.set({ 
            started: false, 
            dealer: Math.floor(Math.random() * 4), 
            players: { slot0:{id:""}, slot1:{id:""}, slot2:{id:""}, slot3:{id:""} } 
        });
        d = (await gameRef.once('value')).val();
    }
    let slot = -1;
    for(let i=0; i<4; i++) { if(!d.players['slot'+i].id) { slot = i; break; } }
    if(slot === -1) return;
    mySlot = slot;
    await gameRef.child('players/slot'+slot).set({id: myId, name: name});
    document.getElementById('lobby').classList.add('hidden');
    sync();
}

function sync() {
    gameRef.on('value', snap => {
        const d = snap.val(); if(!d) return;
        const getPos = (s) => { const rel = (s - mySlot + 4) % 4; return ['bottom', 'right', 'top', 'left'][rel]; };

        for(let i=0; i<4; i++) {
            const pos = getPos(i);
            document.getElementById('p-'+pos).innerHTML = `<strong>${d.players['slot'+i].name || '...'}</strong>${d.dealer===i?' (D)':''}`;
            document.getElementById('p-'+pos).classList.toggle('active', d.turn === i && d.started);
            const sEl = document.getElementById('slot-'+pos);
            if(!d.currentTrick?.['slot'+i]) sEl.innerHTML = '';
            else if(!sEl.innerHTML) sEl.appendChild(createCardUI(d.currentTrick['slot'+i]));
        }

        // Hukm Box Logic
        const hBox = document.getElementById('hukm-box');
        if(d.hukmRevealed && d.hukmCard) {
            hBox.innerHTML = '';
            hBox.className = "hukm-card revealed-hukm";
            hBox.appendChild(createCardInner(d.hukmCard));
        } else {
            hBox.innerHTML = ""; // Card back showing
            hBox.className = "hukm-card";
            hBox.style.background = "linear-gradient(135deg, #a00 0%, #700 100%)";
        }

        document.getElementById('dealBtn').classList.toggle('hidden', !(mySlot === d.dealer && !d.started));
        document.getElementById('playBtn').disabled = (d.turn !== mySlot);

        const hand = document.getElementById('hand-list'); hand.innerHTML = '';
        (d.hands?.['slot'+mySlot] || []).forEach((c, idx) => {
            const el = createCardUI(c);
            // Dealer cannot see their own Hukm card value either
            if(mySlot === d.dealer && c === d.hukmCard && !d.hukmRevealed && d.hands['slot'+mySlot].length > 1) {
                el.classList.add('locked');
                el.innerHTML = ""; 
            } else {
                el.onclick = () => {
                    document.querySelectorAll('.my-hand .card').forEach(x => x.classList.remove('selected'));
                    el.classList.add('selected'); el.dataset.val = c; el.dataset.idx = idx;
                };
            }
            hand.appendChild(el);
        });
    });
}

function createCardInner(c) {
    const suit = c.slice(-1), val = c.slice(0, -1);
    const syms = {H:'♥', D:'♦', S:'♠', C:'♣'};
    const container = document.createElement('div');
    container.className = 'HD'.includes(suit) ? 'red' : '';
    container.style.display = 'contents';
    container.innerHTML = `<div style="font-size:0.7rem">${val}</div><div style="font-size:1.2rem">${syms[suit]}</div><div style="transform:rotate(180deg); font-size:0.7rem">${val}</div>`;
    return container;
}

function createCardUI(c) {
    const el = document.createElement('div');
    el.className = 'card';
    if(c) el.appendChild(createCardInner(c));
    return el;
}

async function dealNewGame() {
    const suits = ['S', 'H', 'D', 'C'], ranks = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];
    let deck = [];
    suits.forEach(s => ranks.forEach(r => deck.push(r+s)));
    deck.sort(() => Math.random() - 0.5);
    const hands = {};
    for(let i=0; i<4; i++) hands['slot'+i] = deck.splice(0, 13);
    
    const snap = await gameRef.once('value');
    const d = snap.val();
    const dealer = d.dealer;
    // System picks the Hukm card from dealer's hand - Dealer doesn't know which one it is!
    const hCard = hands['slot'+dealer][Math.floor(Math.random()*13)];

    await gameRef.update({
        started: true,
        turn: (dealer + 1) % 4,
        hands: hands,
        currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""},
        hukmCard: hCard,
        hukmSuit: hCard.slice(-1),
        hukmRevealed: false,
        leadSuit: ""
    });
}

async function handlePlay() {
    const sel = document.querySelector('.selected');
    if(!sel) return;
    const snap = await gameRef.once('value');
    const d = snap.val();
    const card = sel.dataset.val;

    if(d.leadSuit && !card.endsWith(d.leadSuit)) {
        const hasLead = d.hands['slot'+mySlot].some(c => c.endsWith(d.leadSuit));
        if(hasLead) return alert("Follow Suit!");
        if(!d.hukmRevealed) {
            if(confirm("Cut with Trump? (Reveals Hukm)")) await gameRef.update({ hukmRevealed: true });
        }
    }

    const h = d.hands['slot'+mySlot];
    h.splice(sel.dataset.idx, 1);
    const trick = d.currentTrick || {};
    trick['slot'+mySlot] = card;

    // Flying animation logic
    if(card === d.hukmCard && mySlot === d.dealer) {
        animateHukm(mySlot);
    }

    let updates = { [`hands/slot${mySlot}`]: h, currentTrick: trick, turn: (d.turn + 1) % 4 };
    if(!d.leadSuit) updates.leadSuit = card.slice(-1);

    const played = Object.values(trick).filter(c => c !== "");
    if(played.length === 4) {
        // Simple winner calculation
        const rankMap = {'A':14,'K':13,'Q':12,'J':11,'10':10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
        let winS = 0, hi = -1;
        for(let i=0; i<4; i++) {
            const c = trick['slot'+i], s = c.slice(-1), r = c.slice(0,-1);
            let p = rankMap[r];
            if(s === d.hukmSuit && d.hukmRevealed) p += 100;
            else if(s !== d.leadSuit) p = 0;
            if(p > hi) { hi = p; winS = i; }
        }
        updates.turn = winS; updates.leadSuit = "";
        setTimeout(() => gameRef.update({ currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""} }), 1200);
        
        if(h.length === 0) {
            updates.started = false;
            updates.dealer = (d.dealer + 1) % 4;
        }
    }
    await gameRef.update(updates);
}

function animateHukm(slot) {
    const box = document.getElementById('hukm-box');
    const target = document.getElementById('slot-bottom');
    const rect = target.getBoundingClientRect();
    const boxRect = box.getBoundingClientRect();
    box.style.transition = "all 0.6s ease-in";
    box.style.position = "fixed";
    box.style.left = boxRect.left + "px";
    box.style.top = boxRect.top + "px";
    setTimeout(() => {
        box.style.transform = `translate(${rect.left - boxRect.left}px, ${rect.top - boxRect.top}px) rotate(360deg)`;
        box.style.opacity = "0";
    }, 50);
}
</script>
</body>
</html>
