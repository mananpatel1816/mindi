<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Mindi - Tournament Pro</title>
<style>
  :root { --green: #1a5e3a; --dark: #050c1a; --gold: #f6c85f; --card-w: 70px; --card-h: 100px; }
  body { margin:0; font-family: sans-serif; background: var(--dark); color: white; overflow: hidden; height: 100vh; }
  .felt { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #2d8a57 0%, #1a5e3a 100%); display: flex; align-items: center; justify-content: center; }
  
  .player { position: absolute; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; border: 2px solid #444; min-width: 90px; text-align: center; z-index: 10; }
  .active { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); transform: scale(1.05); }
  .top { top: 20px; left: 50%; transform: translateX(-50%); }
  .bottom { bottom: 180px; left: 50%; transform: translateX(-50%); }
  .left { left: 20px; top: 50%; transform: translateY(-50%); }
  .right { right: 20px; top: 50%; transform: translateY(-50%); }

  .hukm-indicator { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); z-index: 200; text-align: center; }
  .hukm-card { width: 50px; height: 70px; background: #333; border: 2px dashed var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 5px auto; cursor: pointer; }

  .mindi-bin { position: absolute; display: flex; flex-direction: column; gap: 5px; font-size: 0.7rem; align-items: center; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 5px; }
  .bin-A { bottom: 200px; left: 30px; }
  .bin-B { top: 100px; right: 30px; }

  .card { width: var(--card-w); height: var(--card-h); background: white; color: black; border-radius: 6px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px; border: 1px solid #999; box-sizing: border-box; }
  .red { color: #d00; }
  .slot-card { position: absolute; transition: 0.4s; }
  .c-top { top: 110px; left: 50%; transform: translateX(-50%); }
  .c-bottom { bottom: 240px; left: 50%; transform: translateX(-50%); }
  .c-left { left: 160px; top: 50%; transform: translateY(-50%); }
  .c-right { right: 160px; top: 50%; transform: translateY(-50%); }

  .hand-container { position: fixed; bottom: 0; width: 100%; height: 150px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .my-hand { display: flex; gap: -35px; }
  .my-hand .card { margin-left: -35px; cursor: pointer; transition: 0.2s; }
  .my-hand .card:first-child { margin-left: 0; }
  .my-hand .card.selected { transform: translateY(-35px); border: 3px solid #2979ff; z-index: 120; }

  .btn-group { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn { background: var(--gold); color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  .btn-danger { background: #ff4444; color: white; }
  .overlay { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lobby" class="overlay">
  <h1 style="color:var(--gold); font-size: 3rem;">MINDI</h1>
  <input id="userName" placeholder="Enter Name" style="padding:15px; border-radius:10px; width:220px; margin-bottom:15px;" />
  <button class="btn" onclick="joinGame()">JOIN TABLE</button>
</div>

<div class="felt">
  <div class="hukm-indicator">
    <div id="hukm-status" style="font-size:0.7rem">HUKM (TRUMP)</div>
    <div id="hukm-box" class="hukm-card" onclick="revealTrumpManually()">?</div>
    <div id="dealer-msg" style="font-size:0.6rem; color:var(--gold)"></div>
  </div>

  <div class="btn-group">
    <button id="dealBtn" class="btn hidden" onclick="dealNewGame()">DEAL ROUND</button>
    <button class="btn btn-danger" onclick="resetRound()">RESET GAME</button>
  </div>

  <div id="p-top" class="player top">...</div>
  <div id="p-left" class="player left">...</div>
  <div id="p-right" class="player right">...</div>
  <div id="p-bottom" class="player bottom">YOU</div>

  <div class="mindi-bin bin-A">Team A 10s<div id="binA" style="display:flex;gap:2px"></div></div>
  <div class="mindi-bin bin-B">Team B 10s<div id="binB" style="display:flex;gap:2px"></div></div>

  <div id="table-slots">
    <div id="slot-top" class="slot-card c-top"></div>
    <div id="slot-bottom" class="slot-card c-bottom"></div>
    <div id="slot-left" class="slot-card c-left"></div>
    <div id="slot-right" class="slot-card c-right"></div>
  </div>

  <div class="hand-container">
    <div id="hand-list" class="my-hand"></div>
    <button id="playBtn" class="btn" style="margin-left:40px" onclick="handlePlay()">PLAY</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK-6sMXTdm__ptjxE9sae3eSePt-9OaZg",
  authDomain: "mindi-game-93625.firebaseapp.com",
  databaseURL: "https://mindi-game-93625-default-rtdb.firebaseio.com",
  projectId: "mindi-game-93625",
  storageBucket: "mindi-game-93625.firebasestorage.app",
  messagingSenderId: "432897237762",
  appId: "1:432897237762:web:c48c42f7bd63bfeab7d81b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('mindi_v9_tournament'); 
let myId = 'u' + Math.floor(Math.random()*9999);
let mySlot = null;

async function joinGame() {
    const name = document.getElementById('userName').value || "Player";
    const snap = await gameRef.once('value');
    let d = snap.val();
    if(!d || !d.players) {
        await gameRef.set({
            started: false, turn: 0, dealer: 0,
            players: { slot0:{id:""}, slot1:{id:""}, slot2:{id:""}, slot3:{id:""} },
            captured: { teamA: [], teamB: [] }
        });
        d = (await gameRef.once('value')).val();
    }
    let slot = -1;
    for(let i=0; i<4; i++) { if(!d.players['slot'+i].id) { slot = i; break; } }
    if(slot === -1) return alert("Full");
    mySlot = slot;
    await gameRef.child('players/slot'+slot).set({id: myId, name: name});
    document.getElementById('lobby').classList.add('hidden');
    sync();
}

function sync() {
    gameRef.on('value', snap => {
        const d = snap.val(); if(!d) return;
        const getPos = (s) => { const rel = (s - mySlot + 4) % 4; return ['bottom', 'right', 'top', 'left'][rel]; };

        for(let i=0; i<4; i++) {
            const pos = getPos(i);
            document.getElementById('p-'+pos).innerHTML = `<strong>${d.players['slot'+i].name || '...'}</strong>${d.dealer===i?' <small>(D)</small>':''}`;
            document.getElementById('p-'+pos).classList.toggle('active', d.turn === i && d.started);
            const sEl = document.getElementById('slot-'+pos); sEl.innerHTML = '';
            if(d.currentTrick && d.currentTrick['slot'+i]) sEl.appendChild(createCardUI(d.currentTrick['slot'+i]));
        }

        const hBox = document.getElementById('hukm-box');
        if(d.hukmRevealed) {
            hBox.innerHTML = `<span class="${'HD'.includes(d.hukmSuit)?'red':''}">${{H:'♥',D:'♦',S:'♠',C:'♣'}[d.hukmSuit]}</span>`;
            hBox.style.borderStyle = "solid";
        } else { hBox.innerHTML = "?"; hBox.style.borderStyle = "dashed"; }

        document.getElementById('dealer-msg').textContent = `Dealer: ${d.players['slot'+d.dealer]?.name}`;
        
        const renderBin = (id, list) => {
            const el = document.getElementById(id); el.innerHTML = '';
            (list || []).forEach(c => {
                const card = createCardUI(c); card.style.width = "25px"; card.style.height = "35px"; card.style.fontSize = "0.5rem"; el.appendChild(card);
            });
        };
        renderBin('binA', d.captured?.teamA); renderBin('binB', d.captured?.teamB);

        document.getElementById('dealBtn').classList.toggle('hidden', !(mySlot === d.dealer && !d.started));
        document.getElementById('playBtn').disabled = (d.turn !== mySlot);

        const hand = document.getElementById('hand-list'); hand.innerHTML = '';
        (d.hands?.['slot'+mySlot] || []).forEach((c, idx) => {
            const el = createCardUI(c);
            el.onclick = () => {
                document.querySelectorAll('.my-hand .card').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected'); el.dataset.val = c; el.dataset.idx = idx;
            };
            hand.appendChild(el);
        });
    });
}

function createCardUI(c) {
    const el = document.createElement('div');
    const suit = c.slice(-1), val = c.slice(0, -1);
    const syms = {H:'♥', D:'♦', S:'♠', C:'♣'};
    el.className = `card ${'HD'.includes(suit) ? 'red' : ''}`;
    el.innerHTML = `<div>${val}</div><div style="font-size:1.6rem">${syms[suit]}</div><div style="transform:rotate(180deg)">${val}</div>`;
    return el;
}

async function resetRound() {
    const snap = await gameRef.once('value');
    const d = snap.val();
    // End current round but keep teams and increment dealer
    await gameRef.update({
        started: false,
        dealer: (d.dealer + 1) % 4,
        currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""},
        captured: { teamA: [], teamB: [] },
        hukmRevealed: false
    });
}

async function dealNewGame() {
    const suits = ['S','H','D','C'], ranks = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
    let deck = [];
    suits.forEach(s => ranks.forEach(r => deck.push(r+s)));
    deck.sort(() => Math.random() - 0.5);
    const hands = {};
    for(let i=0; i<4; i++) hands['slot'+i] = deck.splice(0, 13);
    
    const snap = await gameRef.once('value');
    const d = snap.val();
    const dealer = d.dealer || 0;
    
    // Dealer hides one of their own cards
    const hIdx = Math.floor(Math.random()*13);
    const hSuit = hands['slot'+dealer][hIdx].slice(-1);

    await gameRef.update({
        started: true,
        turn: (dealer + 1) % 4, // Next to dealer starts
        hands: hands,
        currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""},
        hukmSuit: hSuit,
        hukmRevealed: false,
        leadSuit: "",
        captured: { teamA: [], teamB: [] }
    });
}

async function revealTrumpManually() {
    const snap = await gameRef.once('value');
    const d = snap.val();
    if(d.turn !== mySlot) return;
    
    // Check if player is allowed to reveal (must be out of lead suit)
    const h = d.hands['slot'+mySlot] || [];
    const hasLead = h.some(c => c.endsWith(d.leadSuit));
    
    if(d.leadSuit && !hasLead && !d.hukmRevealed) {
        if(confirm("Reveal Hukm?")) {
            await gameRef.update({ hukmRevealed: true });
        }
    }
}

async function handlePlay() {
    const sel = document.querySelector('.selected');
    if(!sel) return;
    const snap = await gameRef.once('value');
    const d = snap.val();

    const card = sel.dataset.val;
    const suit = card.slice(-1);
    const h = d.hands['slot'+mySlot];

    if(d.leadSuit && suit !== d.leadSuit) {
        const hasSuit = h.some(c => c.endsWith(d.leadSuit));
        if(hasSuit) return alert(`Must follow suit: ${d.leadSuit}`);
    }

    h.splice(sel.dataset.idx, 1);
    const trick = d.currentTrick || {};
    trick['slot'+mySlot] = card;

    let updates = { [`hands/slot${mySlot}`]: h, currentTrick: trick, turn: (d.turn + 1) % 4 };
    if(!d.leadSuit) updates.leadSuit = suit;

    const played = Object.values(trick).filter(c => c !== "");
    if(played.length === 4) {
        const rankMap = {'A':14,'K':13,'Q':12,'J':11,'10':10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
        let winSlot = 0, hi = -1;
        for(let i=0; i<4; i++) {
            const c = trick['slot'+i], s = c.slice(-1), r = c.slice(0,-1);
            let p = rankMap[r];
            if(s === d.hukmSuit && d.hukmRevealed) p += 100;
            else if(s !== d.leadSuit) p = 0;
            if(p > hi) { hi = p; winSlot = i; }
        }
        const tens = played.filter(c => c.startsWith('10'));
        if(tens.length > 0) {
            const team = (winSlot % 2 === 0) ? 'teamA' : 'teamB';
            updates[`captured/${team}`] = [...(d.captured?.[team] || []), ...tens];
        }
        updates.turn = winSlot;
        updates.leadSuit = "";
        setTimeout(() => gameRef.update({ currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""} }), 1500);
    }
    await gameRef.update(updates);
}
</script>
</body>
</html>
