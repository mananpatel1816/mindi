<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Mindi - Pro Session Edition</title>
<style>
  :root { --green: #1a5e3a; --dark: #050c1a; --gold: #f6c85f; --card-w: 70px; --card-h: 100px; }
  body { margin:0; font-family: sans-serif; background: var(--dark); color: white; overflow: hidden; height: 100vh; }
  .felt { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #2d8a57 0%, #1a5e3a 100%); display: flex; align-items: center; justify-content: center; }
  
  .player { position: absolute; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 8px; border: 2px solid #444; min-width: 90px; text-align: center; z-index: 10; transition: all 0.3s; }
  .active { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); transform: scale(1.05); }
  .top { top: 20px; left: 50%; transform: translateX(-50%); }
  .bottom { bottom: 180px; left: 50%; transform: translateX(-50%); }
  .left { left: 20px; top: 50%; transform: translateY(-50%); }
  .right { right: 20px; top: 50%; transform: translateY(-50%); }

  .hukm-indicator { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); z-index: 200; text-align: center; }
  .hukm-card { width: 55px; height: 80px; background: #333; border: 2px dashed var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin: 5px auto; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; }
  .revealed-hukm { background: white; color: black; border-style: solid; font-weight: bold; flex-direction: column; justify-content: space-between; padding: 5px; box-sizing: border-box; }

  .card { width: var(--card-w); height: var(--card-h); background: white; color: black; border-radius: 6px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px; border: 1px solid #999; box-sizing: border-box; position: relative; }
  .locked { filter: grayscale(1) opacity(0.5); cursor: not-allowed !important; }
  .locked::after { content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; }
  
  .red { color: #d00; }
  .slot-card { position: absolute; transition: 0.5s ease-in-out; }
  
  /* Positions for trick cards */
  .c-top { top: 110px; left: 50%; transform: translateX(-50%); }
  .c-bottom { bottom: 240px; left: 50%; transform: translateX(-50%); }
  .c-left { left: 160px; top: 50%; transform: translateY(-50%); }
  .c-right { right: 160px; top: 50%; transform: translateY(-50%); }

  .hand-container { position: fixed; bottom: 0; width: 100%; height: 150px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .my-hand { display: flex; gap: -35px; }
  .my-hand .card { margin-left: -35px; cursor: pointer; transition: 0.2s; }
  .my-hand .card.selected { transform: translateY(-35px); border: 3px solid #2979ff; z-index: 120; }

  .btn { background: var(--gold); color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  .btn-danger { background: #ff4444; color: white; position: fixed; top: 20px; right: 20px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="lobby" class="overlay" style="position:fixed; inset:0; background:var(--dark); z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <h1 style="color:var(--gold)">MINDI GLOBAL</h1>
  <input id="userName" placeholder="Enter Name" style="padding:15px; border-radius:10px; border:none; width:220px; margin-bottom:15px;" />
  <button class="btn" onclick="joinGame()">JOIN SESSION</button>
</div>

<div class="felt">
  <div class="hukm-indicator">
    <div style="font-size:0.7rem">HUKM (TRUMP)</div>
    <div id="hukm-box" class="hukm-card">?</div>
  </div>

  <button class="btn-danger" onclick="resetSession()">END SESSION</button>
  <button id="dealBtn" class="btn hidden" style="position:absolute; top:45%" onclick="dealNewGame()">DEAL CARDS</button>

  <div id="p-top" class="player top">...</div>
  <div id="p-left" class="player left">...</div>
  <div id="p-right" class="player right">...</div>
  <div id="p-bottom" class="player bottom">YOU</div>

  <div id="table-slots">
    <div id="slot-top" class="slot-card c-top"></div>
    <div id="slot-bottom" class="slot-card c-bottom"></div>
    <div id="slot-left" class="slot-card c-left"></div>
    <div id="slot-right" class="slot-card c-right"></div>
  </div>

  <div class="hand-container">
    <div id="hand-list" class="my-hand"></div>
    <button id="playBtn" class="btn" style="margin-left:40px" onclick="handlePlay()">PLAY CARD</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK-6sMXTdm__ptjxE9sae3eSePt-9OaZg",
  authDomain: "mindi-game-93625.firebaseapp.com",
  databaseURL: "https://mindi-game-93625-default-rtdb.firebaseio.com",
  projectId: "mindi-game-93625",
  storageBucket: "mindi-game-93625.firebasestorage.app",
  messagingSenderId: "432897237762",
  appId: "1:432897237762:web:c48c42f7bd63bfeab7d81b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('mindi_v11_animated');
let myId = 'u' + Math.floor(Math.random()*999);
let mySlot = null;

async function joinGame() {
    const name = document.getElementById('userName').value || "Player";
    const snap = await gameRef.once('value');
    let d = snap.val();
    if(!d || !d.players) {
        // First game: Random dealer
        await gameRef.set({ 
            started: false, 
            dealer: Math.floor(Math.random() * 4), 
            players: { slot0:{id:""}, slot1:{id:""}, slot2:{id:""}, slot3:{id:""} } 
        });
        d = (await gameRef.once('value')).val();
    }
    let slot = -1;
    for(let i=0; i<4; i++) { if(!d.players['slot'+i].id) { slot = i; break; } }
    if(slot === -1) return;
    mySlot = slot;
    await gameRef.child('players/slot'+slot).set({id: myId, name: name});
    document.getElementById('lobby').classList.add('hidden');
    sync();
}

function sync() {
    gameRef.on('value', snap => {
        const d = snap.val(); if(!d) return;
        const getPos = (s) => { const rel = (s - mySlot + 4) % 4; return ['bottom', 'right', 'top', 'left'][rel]; };

        for(let i=0; i<4; i++) {
            const pos = getPos(i);
            const pEl = document.getElementById('p-'+pos);
            pEl.innerHTML = `<strong>${d.players['slot'+i].name || '...'}</strong>${d.dealer===i?' (D)':''}`;
            pEl.classList.toggle('active', d.turn === i && d.started);
            
            const sEl = document.getElementById('slot-'+pos);
            if(!d.currentTrick?.['slot'+i]) sEl.innerHTML = '';
            else if(!sEl.innerHTML) sEl.appendChild(createCardUI(d.currentTrick['slot'+i]));
        }

        const hBox = document.getElementById('hukm-box');
        if(d.hukmRevealed && d.hukmCard) {
            if(hBox.innerHTML === "?" || hBox.innerHTML === "") {
                hBox.innerHTML = '';
                hBox.className = "hukm-card revealed-hukm";
                hBox.appendChild(createCardInner(d.hukmCard));
            }
        } else {
            hBox.innerHTML = "?";
            hBox.className = "hukm-card";
            hBox.style.transform = "none";
        }

        document.getElementById('dealBtn').classList.toggle('hidden', !(mySlot === d.dealer && !d.started));
        document.getElementById('playBtn').disabled = (d.turn !== mySlot);

        const hand = document.getElementById('hand-list'); hand.innerHTML = '';
        (d.hands?.['slot'+mySlot] || []).forEach((c, idx) => {
            const el = createCardUI(c);
            // Lock dealer's card until the end
            if(mySlot === d.dealer && c === d.hukmCard && d.hands['slot'+mySlot].length > 1) {
                el.classList.add('locked');
            } else {
                el.onclick = () => {
                    document.querySelectorAll('.my-hand .card').forEach(x => x.classList.remove('selected'));
                    el.classList.add('selected'); el.dataset.val = c; el.dataset.idx = idx;
                };
            }
            hand.appendChild(el);
        });
    });
}

function createCardInner(c) {
    const suit = c.slice(-1), val = c.slice(0, -1);
    const syms = {H:'♥', D:'♦', S:'♠', C:'♣'};
    const container = document.createElement('div');
    container.className = 'HD'.includes(suit) ? 'red' : '';
    container.style.display = 'contents';
    container.innerHTML = `<div>${val}</div><div style="font-size:1.5rem">${syms[suit]}</div><div style="transform:rotate(180deg)">${val}</div>`;
    return container;
}

function createCardUI(c) {
    const el = document.createElement('div');
    el.className = 'card';
    el.appendChild(createCardInner(c));
    return el;
}

async function dealNewGame() {
    const suits = ['S','H','D','C'], ranks = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
    let deck = [];
    suits.forEach(s => ranks.forEach(r => deck.push(r+s)));
    deck.sort(() => Math.random() - 0.5);
    const hands = {};
    for(let i=0; i<4; i++) hands['slot'+i] = deck.splice(0, 13);
    
    const snap = await gameRef.once('value');
    const d = snap.val();
    const dealer = d.dealer;
    const hCard = hands['slot'+dealer][Math.floor(Math.random()*13)];

    await gameRef.update({
        started: true,
        turn: (dealer + 1) % 4, // Next to dealer starts
        hands: hands,
        currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""},
        hukmCard: hCard,
        hukmSuit: hCard.slice(-1),
        hukmRevealed: false,
        leadSuit: ""
    });
}

async function handlePlay() {
    const sel = document.querySelector('.selected');
    if(!sel) return;
    const snap = await gameRef.once('value');
    const d = snap.val();
    const card = sel.dataset.val;

    if(d.leadSuit && !card.endsWith(d.leadSuit)) {
        const hasLead = d.hands['slot'+mySlot].some(c => c.endsWith(d.leadSuit));
        if(hasLead) return alert("Must follow suit!");
        if(!d.hukmRevealed) {
            if(confirm("Reveal Hukm?")) await gameRef.update({ hukmRevealed: true });
        }
    }

    const h = d.hands['slot'+mySlot];
    h.splice(sel.dataset.idx, 1);
    const trick = d.currentTrick || {};
    trick['slot'+mySlot] = card;

    // Animation: If it's the dealer's secret card, animate from the box
    if(card === d.hukmCard && mySlot === d.dealer) {
        animateHukmToTable(mySlot);
    }

    let updates = { [`hands/slot${mySlot}`]: h, currentTrick: trick, turn: (d.turn + 1) % 4 };
    if(!d.leadSuit) updates.leadSuit = card.slice(-1);

    const played = Object.values(trick).filter(c => c !== "");
    if(played.length === 4) {
        // Winner logic
        const rankMap = {'A':14,'K':13,'Q':12,'J':11,'10':10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
        let winS = 0, hi = -1;
        for(let i=0; i<4; i++) {
            const c = trick['slot'+i], s = c.slice(-1), r = c.slice(0,-1);
            let p = rankMap[r];
            if(s === d.hukmSuit && d.hukmRevealed) p += 100;
            else if(s !== d.leadSuit) p = 0;
            if(p > hi) { hi = p; winS = i; }
        }
        updates.turn = winS;
        updates.leadSuit = "";
        setTimeout(() => gameRef.update({ currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""} }), 1500);
        
        // If hand empty, prepare for next round (rotate dealer)
        if(h.length === 0) {
            updates.started = false;
            updates.dealer = (d.dealer + 1) % 4;
        }
    }
    await gameRef.update(updates);
}

function animateHukmToTable(slot) {
    const box = document.getElementById('hukm-box');
    const target = document.getElementById('slot-bottom'); // Always bottom for current player
    const rect = target.getBoundingClientRect();
    const boxRect = box.getBoundingClientRect();
    
    box.style.transition = "all 0.6s cubic-bezier(0.5, 0, 0.5, 1)";
    box.style.position = "fixed";
    box.style.left = boxRect.left + "px";
    box.style.top = boxRect.top + "px";
    
    setTimeout(() => {
        box.style.transform = `translate(${rect.left - boxRect.left}px, ${rect.top - boxRect.top}px) rotate(360deg)`;
        box.style.opacity = "0";
    }, 10);
}

async function resetSession() {
    if(confirm("End session and reset everything?")) {
        await gameRef.remove();
        location.reload();
    }
}
</script>
</body>
</html>
