<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Mindi - Strict 4-Player</title>
<style>
  :root { --green: #1a5e3a; --dark: #050c1a; --gold: #f6c85f; --card-w: 50px; --card-h: 72px; }
  body { margin:0; font-family: -apple-system, sans-serif; background: var(--dark); color: white; overflow: hidden; height: 100vh; touch-action: manipulation; }
  .felt { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #2d8a57 0%, #1a5e3a 100%); overflow: hidden; }

  /* Hamburger Menu */
  #menu-toggle { position: fixed; top: 15px; right: 15px; z-index: 1000; background: rgba(0,0,0,0.6); border: 1px solid var(--gold); border-radius: 5px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  #menu-toggle span { width: 20px; height: 2px; background: var(--gold); display: block; }
  
  .scoreboard { position: fixed; top: 60px; right: 15px; background: rgba(0,0,0,0.95); padding: 15px; border-radius: 12px; border: 1.5px solid var(--gold); z-index: 999; min-width: 180px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .score-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .team-names { font-size: 0.75rem; color: #ccc; }
  .score-val { color: var(--gold); font-weight: bold; font-size: 1.2rem; }

  /* Player Positions */
  .player-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 10; width: 90px; }
  .player { background: rgba(0,0,0,0.8); padding: 5px; border-radius: 12px; border: 1px solid #555; font-size: 0.7rem; width: 100%; text-align: center; }
  .active { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  
  .mindi-stack { display: flex; gap: 2px; min-height: 20px; justify-content: center; }
  .mindi-mini { width: 16px; height: 22px; background: white; border-radius: 2px; font-size: 0.45rem; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; }

  .top { top: 60px; left: 50%; transform: translateX(-50%); }
  .bottom { bottom: 240px; left: 50%; transform: translateX(-50%); }
  .left { left: 10px; top: 40%; transform: translateY(-50%); }
  .right { right: 10px; top: 40%; transform: translateY(-50%); }

  /* Center Slots */
  .slot-card { position: absolute; transition: 0.3s ease-out; width: var(--card-w); height: var(--card-h); }
  .c-top { top: 150px; left: 50%; transform: translateX(-50%); }
  .c-bottom { bottom: 320px; left: 50%; transform: translateX(-50%); }
  .c-left { left: 85px; top: 40%; transform: translateY(-50%); }
  .c-right { right: 85px; top: 40%; transform: translateY(-50%); }

  /* Bottom Controls */
  .controls { position: fixed; bottom: 0; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; background: linear-gradient(transparent, rgba(0,0,0,0.9) 50%); pointer-events: none; }
  .btn { pointer-events: auto; background: var(--gold); color: black; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 900; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.4); margin-bottom: 15px; }
  .btn:disabled { background: #444; color: #777; box-shadow: none; }

  /* Hand Container */
  .hand-container { pointer-events: auto; display: flex; justify-content: center; width: 100%; height: 80px; }
  .card { width: var(--card-w); height: var(--card-h); background: white; color: black; border-radius: 5px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 3px; border: 1px solid #666; box-sizing: border-box; font-size: 0.8rem; position: relative; }
  .my-hand .card { margin-left: -32px; transition: 0.2s; box-shadow: -2px 0 5px rgba(0,0,0,0.4); }
  .my-hand .card.selected { transform: translateY(-25px); border: 2px solid #007bff; z-index: 100 !important; margin-right: 10px; }
  
  .suit-large { font-size: 1.2rem; line-height: 1; }
  .red { color: #e00; }
  .hukm-indicator { position: fixed; top: 15px; left: 15px; z-index: 200; }
  .hukm-card { width: 35px; height: 50px; background: #900; border: 2px solid #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: white; }
  .overlay { position: fixed; inset: 0; background: var(--dark); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="lobby" class="overlay">
  <h2 style="color:var(--gold)">MINDI TABLE</h2>
  <div id="waiting-msg" style="margin-bottom:10px; font-size:0.8rem; color:#aaa">Enter name to join</div>
  <input id="userName" placeholder="Your Name" style="padding:15px; border-radius:10px; width:220px; margin-bottom:15px; border:none;" />
  <button class="btn" onclick="joinGame()">SIT DOWN</button>
</div>

<div id="menu-toggle" onclick="toggleScoreboard()">
  <span></span><span></span><span></span>
</div>

<div class="scoreboard" id="scorePanel">
  <div style="font-size:0.7rem; color:var(--gold); text-align:center; margin-bottom:10px;">SETS WON (4-0)</div>
  <div class="score-row"><div id="names-a" class="team-names">Team A</div><span id="score-a" class="score-val">0</span></div>
  <div class="score-row"><div id="names-b" class="team-names">Team B</div><span id="score-b" class="score-val">0</span></div>
  <button class="btn-draw" style="width:100%; background:#333; color:white; border:none; padding:8px; border-radius:5px; margin-top:10px;" onclick="callMutualDraw()">MUTUAL END (DRAW)</button>
</div>

<div class="felt">
  <div class="hukm-indicator"><div id="hukm-box" class="hukm-card">M</div></div>
  
  <button id="dealBtn" class="btn" style="position:absolute; top:45%; left:50%; transform:translateX(-50%); z-index:500; display:none;" onclick="dealNewGame()">DEAL CARDS</button>

  <div id="w-top" class="player-wrapper top"><div id="mindi-top" class="mindi-stack"></div><div id="p-top" class="player">Empty</div></div>
  <div id="w-left" class="player-wrapper left"><div id="p-left" class="player">Empty</div><div id="mindi-left" class="mindi-stack"></div></div>
  <div id="w-right" class="player-wrapper right"><div id="p-right" class="player">Empty</div><div id="mindi-right" class="mindi-stack"></div></div>
  <div id="w-bottom" class="player-wrapper bottom"><div id="mindi-bottom" class="mindi-stack"></div><div id="p-bottom" class="player">YOU</div></div>

  <div id="table-slots">
    <div id="slot-top" class="slot-card c-top"></div><div id="slot-bottom" class="slot-card c-bottom"></div>
    <div id="slot-left" class="slot-card c-left"></div><div id="slot-right" class="slot-card c-right"></div>
  </div>

  <div class="controls">
    <button id="playBtn" class="btn" onclick="handlePlay()">PLAY CARD</button>
    <div id="hand-list" class="my-hand hand-container"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK-6sMXTdm__ptjxE9sae3eSePt-9OaZg",
  authDomain: "mindi-game-93625.firebaseapp.com",
  databaseURL: "https://mindi-game-93625-default-rtdb.firebaseio.com",
  projectId: "mindi-game-93625",
  storageBucket: "mindi-game-93625.firebasestorage.app",
  messagingSenderId: "432897237762",
  appId: "1:432897237762:web:c48c42f7bd63bfeab7d81b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('mindi_v25_strict');

// ID is unique to THIS TAB only, so you can open 4 tabs on 1 PC
let myId = 'u' + Math.floor(Math.random()*1000000); 
let mySlot = null;

function toggleScoreboard() {
  const p = document.getElementById('scorePanel');
  p.style.display = (p.style.display === 'block') ? 'none' : 'block';
}

async function joinGame() {
    const name = document.getElementById('userName').value || "Player";
    const snap = await gameRef.once('value');
    let d = snap.val();
    if(!d) {
        await gameRef.set({ started: false, dealer: 0, matchScore: {A:0, B:0}, players: { slot0:{id:""}, slot1:{id:""}, slot2:{id:""}, slot3:{id:""} } });
        d = (await gameRef.once('value')).val();
    }
    let slot = -1;
    for(let i=0; i<4; i++) { if(!d.players['slot'+i].id) { slot = i; break; } }
    if(slot === -1) return alert("Table is full!");
    mySlot = slot;
    await gameRef.child('players/slot'+slot).set({id: myId, name: name});
    document.getElementById('lobby').style.display = 'none';
    sync();
}

function sync() {
    gameRef.on('value', snap => {
        const d = snap.val(); if(!d) return;
        
        const n0 = d.players.slot0.name || "P1";
        const n1 = d.players.slot1.name || "P2";
        const n2 = d.players.slot2.name || "P3";
        const n3 = d.players.slot3.name || "P4";
        
        document.getElementById('names-a').innerText = `${n0} & ${n2}`;
        document.getElementById('names-b').innerText = `${n1} & ${n3}`;
        document.getElementById('score-a').innerText = d.matchScore?.A || 0;
        document.getElementById('score-b').innerText = d.matchScore?.B || 0;

        let playerCount = 0;
        for(let i=0; i<4; i++) if(d.players['slot'+i].id) playerCount++;

        const getPos = (s) => { 
            const rel = (s - mySlot + 4) % 4; 
            return ['bottom', 'left', 'top', 'right'][rel]; 
        };

        for(let i=0; i<4; i++) {
            const pos = getPos(i); const p = d.players['slot'+i];
            document.getElementById('p-'+pos).innerHTML = `<strong>${p.name || 'Empty'}</strong>${d.dealer===i?' (D)':''}`;
            document.getElementById('p-'+pos).classList.toggle('active', d.turn === i && d.started);
            
            const mStack = document.getElementById('mindi-'+pos); mStack.innerHTML = '';
            (d.mindis?.['slot'+i] || []).forEach(c => {
                const card = document.createElement('div'); card.className = 'mindi-mini';
                card.innerHTML = `10${{H:'♥', D:'♦', S:'♠', C:'♣'}[c.slice(-1)]}`;
                if('HD'.includes(c.slice(-1))) card.style.color = 'red';
                mStack.appendChild(card);
            });
            const sEl = document.getElementById('slot-'+pos);
            if(!d.currentTrick?.['slot'+i]) sEl.innerHTML = '';
            else if(!sEl.innerHTML) sEl.appendChild(createCardUI(d.currentTrick['slot'+i]));
        }

        const hBox = document.getElementById('hukm-box');
        if(d.hukmRevealed) {
            hBox.innerHTML = ''; hBox.appendChild(createCardInner(d.hukmCard));
        } else { hBox.innerHTML = "M"; }

        // DEAL BUTTON LOGIC: Dealer must be you AND 4 players must be seated
        document.getElementById('dealBtn').style.display = (mySlot === d.dealer && !d.started && playerCount === 4) ? 'block' : 'none';
        document.getElementById('playBtn').disabled = (d.turn !== mySlot);

        const hand = document.getElementById('hand-list'); hand.innerHTML = '';
        (d.hands?.['slot'+mySlot] || []).forEach((c, idx) => {
            const el = createCardUI(c);
            if(mySlot === d.dealer && c === d.hukmCard && !d.hukmRevealed && d.hands['slot'+mySlot].length > 1) {
                el.style.opacity = "0.3"; // Hukm is locked
            } else {
                el.onclick = () => {
                    document.querySelectorAll('.my-hand .card').forEach(x => x.classList.remove('selected'));
                    el.classList.add('selected'); el.dataset.val = c; el.dataset.idx = idx;
                };
            }
            hand.appendChild(el);
        });
    });
}

function createCardInner(c) {
    const suit = c.slice(-1), val = c.slice(0, -1);
    const syms = {H:'♥', D:'♦', S:'♠', C:'♣'};
    const container = document.createElement('div');
    if('HD'.includes(suit)) container.className = 'red';
    container.style.display = 'contents';
    container.innerHTML = `<span>${val}</span><span class="suit-large">${syms[suit]}</span>`;
    return container;
}

function createCardUI(c) {
    const el = document.createElement('div'); el.className = 'card';
    if(c) el.appendChild(createCardInner(c));
    return el;
}

async function dealNewGame() {
    const suits = ['S','H','D','C'], ranks = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
    let deck = []; suits.forEach(s => ranks.forEach(r => deck.push(r+s)));
    deck.sort(() => Math.random() - 0.5);
    const hands = {}; for(let i=0; i<4; i++) hands['slot'+i] = deck.splice(0, 13);
    const snap = await gameRef.once('value'); const d = snap.val();
    const hCard = hands['slot'+d.dealer][Math.floor(Math.random()*13)];
    await gameRef.update({ started: true, turn: (d.dealer + 1) % 4, hands: hands, currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""}, hukmCard: hCard, hukmSuit: hCard.slice(-1), hukmRevealed: false, leadSuit: "", mindis: {slot0:[], slot1:[], slot2:[], slot3:[]} });
}

async function handlePlay() {
    const sel = document.querySelector('.selected'); if(!sel) return;
    const snap = await gameRef.once('value'); const d = snap.val();
    const card = sel.dataset.val;
    if(d.leadSuit && !card.endsWith(d.leadSuit)) {
        if(d.hands['slot'+mySlot].some(c => c.endsWith(d.leadSuit))) return alert("Follow Suit!");
        if(!d.hukmRevealed && (mySlot !== d.dealer || d.hands['slot'+mySlot].length === 1)) {
            if(confirm("Reveal Hukm?")) await gameRef.update({ hukmRevealed: true });
        }
    }
    const h = d.hands['slot'+mySlot]; h.splice(sel.dataset.idx, 1);
    const trick = d.currentTrick || {}; trick['slot'+mySlot] = card;
    let updates = { [`hands/slot${mySlot}`]: h, currentTrick: trick, turn: (d.turn + 1) % 4 };
    if(!d.leadSuit) updates.leadSuit = card.slice(-1);
    const played = Object.values(trick).filter(c => c !== "");
    if(played.length === 4) {
        const rankMap = {'A':14,'K':13,'Q':12,'J':11,'10':10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
        let winS = 0, hi = -1;
        for(let i=0; i<4; i++) {
            const c = trick['slot'+i], s = c.slice(-1), r = c.slice(0,-1);
            let p = rankMap[r];
            if(s === d.hukmSuit && d.hukmRevealed) p += 100; else if(s !== d.leadSuit) p = 0;
            if(p > hi) { hi = p; winS = i; }
        }
        const tens = played.filter(c => c.startsWith('10'));
        if(tens.length > 0) updates[`mindis/slot${winS}`] = [...(d.mindis?.[`slot${winS}`] || []), ...tens];
        updates.turn = winS; updates.leadSuit = "";
        if(h.length === 0) { 
            let totalA = (d.mindis?.slot0?.length || 0) + (d.mindis?.slot2?.length || 0) + (winS % 2 === 0 ? tens.length : 0);
            let totalB = (d.mindis?.slot1?.length || 0) + (d.mindis?.slot3?.length || 0) + (winS % 2 !== 0 ? tens.length : 0);
            let scA = d.matchScore.A, scB = d.matchScore.B;
            if(totalA === 4) scA++; else if (totalB === 4) scB++;
            updates.matchScore = { A: scA, B: scB }; updates.started = false; updates.dealer = (d.dealer + 1) % 4; 
        }
        setTimeout(() => gameRef.update(updates), 1000);
    } else { await gameRef.update(updates); }
}
async function callMutualDraw() {
    if(!confirm("End game?")) return;
    const snap = await gameRef.once('value'); const d = snap.val();
    await gameRef.update({ started: false, dealer: (d.dealer + 1) % 4, currentTrick: null, hands: null, hukmRevealed: false });
    toggleScoreboard();
}
</script>
</body>
</html>
