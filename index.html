Bug fixes:

Cards reappearing after rounds — The old code had a race condition: the 1500ms setTimeout could fire after dealNewGame(), overwriting the new game state. Fixed by restructuring processPlay to first push the played card to Firebase immediately, then after the 1200ms visual delay, apply trick results in a single atomic update. Round-end now fires one clean update with no delayed callbacks that could conflict.
Second mindi display broken — Firebase sometimes returns a single-element array as a plain object {0: "10H"} instead of ["10H"]. Added a toArray() helper that handles both cases with Array.isArray() check. Also replaced the shared .top-left/.bot-right CSS class names on mini-card internals (they conflicted with player position classes) with .m-rank and .m-suit.

function sync(){
  gameRef.on('value',snap=>{
    const d=snap.val(); if(!d||!d.players) return;
    const pn=i=>d.players['slot'+i]?.name||'P'+(i+1);
    document.getElementById('tALbl').textContent=`${pn(0)} · ${pn(2)} · ${pn(4)}`;
    document.getElementById('tBLbl').textContent=`${pn(1)} · ${pn(3)} · ${pn(5)}`;
    const sa=d.matchScore?.A||0, sb=d.matchScore?.B||0;
    ['spA','hSA'].forEach(id=>document.getElementById(id).textContent=sa);
    ['spB','hSB'].forEach(id=>document.getElementById(id).textContent=sb);
    let mt=0; for(let i=0;i<6;i++) mt+=toArr(d.mindis?.['slot'+i]).length;
    document.getElementById('mCnt').textContent=`${mt}/4`;
 
    const hi=document.getElementById('hukmIcon');
    const hl=document.getElementById('hukmLabel');
    if(d.hukmRevealed&&d.hukmCard){
      const hs=d.hukmCard.slice(-1);
      hi.textContent=SYMS[hs]; hi.style.background='HD'.includes(hs)?'rgba(220,38,38,0.3)':'rgba(255,255,255,0.12)';
      hi.style.color='HD'.includes(hs)?'#f87171':'#fff'; hl.textContent=d.hukmCard.slice(0,-1)+SYMS[hs];
    } else { hi.textContent='?'; hi.style.background='#7f1d1d'; hi.style.color=''; hl.textContent='HUKM'; }
 
    let pCount=0;
    for(let i=0;i<6;i++){
      const pos=vp(i), p=d.players['slot'+i]; if(p.id) pCount++;
      const wrap=document.getElementById('p-'+pos);
      const av=wrap.querySelector('.avatar');
      const nm=wrap.querySelector('.av-name');
      const cb=wrap.querySelector('.card-badge');
      const mr=wrap.querySelector('.mindi-row');
      const displayName=p.name||'?';
      // Set avatar initials (preserve dealer-dot)
      const dot=av.querySelector('.dealer-dot');
      av.innerHTML=''; av.appendChild(dot); av.appendChild(document.createTextNode(displayName.substring(0,2)));
      nm.textContent=displayName;
      av.classList.toggle('active', d.turn===i&&d.started);
      av.classList.toggle('is-dealer', d.dealer===i);
      cb.textContent=d.started?toArr(d.hands?.['slot'+i]).length:'-';
 
      // Mindis
      const cms=toArr(d.mindis?.['slot'+i]);
      const existing=Array.from(mr.children).map(c=>c.dataset.card).join(',');
      if(existing!==cms.join(',')){
        mr.innerHTML='';
        cms.forEach(mc=>{
          const s=mc.slice(-1),v=mc.slice(0,-1),red='HD'.includes(s);
          const div=document.createElement('div');
          div.className='mm'+(red?' red':''); div.dataset.card=mc;
          div.innerHTML=`<div class="mr">${v}</div><div class="ms">${SYMS[s]}</div>`;
          mr.appendChild(div);
        });
      }
 
      // Trick slot
      const sEl=document.getElementById('slot-'+pos);
      const tc=d.currentTrick?.['slot'+i]||'';
      if(!tc){ sEl.innerHTML=''; }
      else if(sEl.querySelector('.card')?.dataset?.card!==tc){
        sEl.innerHTML=''; const cel=mkCard(tc); cel.dataset.card=tc; sEl.appendChild(cel);
      }
    }
 
    document.getElementById('dealBtn').style.display=(mySlot===d.dealer&&!d.started&&pCount===6)?'block':'none';
    document.getElementById('playBtn').disabled=(d.turn!==mySlot||!d.started||isProcessing);
 
    // My hand
    const hDiv=document.getElementById('handCards');
    const myHand=toArr(d.hands?.['slot'+mySlot]).sort((a,b)=>{
      if(a==='HUKM_HIDDEN') return 1; if(b==='HUKM_HIDDEN') return -1;
      return a.slice(-1).localeCompare(b.slice(-1));
    });
    const existVals=Array.from(hDiv.children).map(c=>c.dataset.val);
    if(JSON.stringify(myHand)!==JSON.stringify(existVals)){
      hDiv.innerHTML='';
      myHand.forEach((c,idx)=>{
        const nonH=myHand.filter(x=>x!=='HUKM_HIDDEN');
        const isHid=(c==='HUKM_HIDDEN'&&mySlot===d.dealer&&!d.hukmRevealed);
        let el;
        if(isHid){
          el=mkBack();
          if(nonH.length===0){ el.onclick=()=>sel(el); }
          else { el.classList.add('locked'); el.onclick=()=>alert("Play Hukm only as your last card!"); }
        } else { el=mkCard(c); el.onclick=()=>sel(el); }
        el.dataset.val=c; el.dataset.idx=idx; hDiv.appendChild(el);
      });
    }
 
    const ov=document.getElementById('roundOv');
    if(d.roundResult?.active){
      document.getElementById('winTxt').textContent=d.roundResult.winner||'';
      document.getElementById('whyTxt').textContent=d.roundResult.reason||'';
      ov.style.display='flex';
    } else { ov.style.display='none'; }
  });
}
 
async function dealNewGame(){
  const suits=['S','H','D','C'],ranks=['A','K','Q','J','10','9','8','7','6','5','4','3','2'],deck=[];
  suits.forEach(s=>ranks.forEach(r=>deck.push(r+s)));
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  const hands={}; for(let i=0;i<6;i++) hands['slot'+i]=deck.splice(0,8);
  const d=(await gameRef.once('value')).val();
  const hIdx=Math.floor(Math.random()*8),hCard=hands['slot'+d.dealer].splice(hIdx,1)[0];
  hands['slot'+d.dealer].push('HUKM_HIDDEN');
  await gameRef.update({started:true,turn:(d.dealer+1)%6,hands,currentTrick:{slot0:'',slot1:'',slot2:'',slot3:'',slot4:'',slot5:''},hukmCard:hCard,hukmSuit:hCard.slice(-1),hukmRevealed:false,leadSuit:'',mindis:{slot0:[],slot1:[],slot2:[],slot3:[],slot4:[],slot5:[]},totalTricksWon:{slot0:0,slot1:0,slot2:0,slot3:0,slot4:0,slot5:0},roundResult:{active:false}});
}
 
async function handlePlay(){
  if(isProcessing) return;
  const s=document.querySelector('.hand-cards .card.selected');
  if(!s) return alert("Select a card first!");
  isProcessing=true; document.getElementById('playBtn').disabled=true;
  try{
    const d=(await gameRef.once('value')).val();
    if(!d||d.turn!==mySlot){isProcessing=false;return;}
    let card=s.dataset.val, idx=parseInt(s.dataset.idx);
    if(card==='HUKM_HIDDEN'&&mySlot===d.dealer&&!d.hukmRevealed){
      const nonH=toArr(d.hands['slot'+mySlot]).filter(c=>c!=='HUKM_HIDDEN');
      if(nonH.length>0){isProcessing=false;return alert("Play Hukm only as your last card!");}
      await gameRef.update({hukmRevealed:true});
      const d2=(await gameRef.once('value')).val();
      await processPlay(d.hukmCard,idx,d2); return;
    }
    if(d.leadSuit&&!card.endsWith(d.leadSuit)){
      const myH=toArr(d.hands['slot'+mySlot]);
      const hasLead=myH.some(c=>c!=='HUKM_HIDDEN'&&c.endsWith(d.leadSuit));
      if(hasLead){isProcessing=false;return alert("You must follow suit!");}
      if(!d.hukmRevealed){
        if(mySlot===d.dealer){isProcessing=false;return alert("As dealer you cannot reveal Hukm until your last card!");}
        if(confirm("No lead suit — reveal Hukm now?\n(You must then play trump if you have one)")){
          const h=toArr(d.hands['slot'+d.dealer]);
          const hi=h.indexOf('HUKM_HIDDEN'); if(hi!==-1) h[hi]=d.hukmCard;
          await gameRef.update({hukmRevealed:true,[`hands/slot${d.dealer}`]:h});
          await new Promise(r=>setTimeout(r,200));
          const d2=(await gameRef.once('value')).val();
          const myH2=toArr(d2.hands['slot'+mySlot]);
          if(myH2.some(c=>c.endsWith(d2.hukmSuit))&&!card.endsWith(d2.hukmSuit)){
            isProcessing=false;
            document.querySelectorAll('.hand-cards .card').forEach(x=>x.classList.remove('selected'));
            return alert("Hukm revealed — you must play a trump card!");
          }
          await processPlay(card,idx,d2); return;
        }
      }
    }
    await processPlay(card,idx,d);
  } catch(e){ console.error(e); isProcessing=false; }
}
 
async function processPlay(card,idx,d){
  try{
    const hand=toArr(d.hands['slot'+mySlot]);
    if(hand[idx]==='HUKM_HIDDEN') card=d.hukmCard;
    hand.splice(idx,1);
    const trick={...(d.currentTrick||{})}; trick['slot'+mySlot]=card;
    const upd={[`hands/slot${mySlot}`]:hand,currentTrick:trick,turn:(d.turn+1)%6};
    if(!d.leadSuit) upd.leadSuit=card.slice(-1);
    await gameRef.update(upd);
    const played=Object.values(trick).filter(c=>c!=='');
    if(played.length<6){isProcessing=false;return;}
    await new Promise(r=>setTimeout(r,1200));
    const RM={'A':14,'K':13,'Q':12,'J':11,'10':10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
    let winS=0,hi=-1;
    const ls=d.leadSuit||card.slice(-1);
    for(let i=0;i<6;i++){
      const c=trick['slot'+i],s=c.slice(-1),r=c.slice(0,-1);
      let p=RM[r]||0;
      if(d.hukmRevealed&&s===d.hukmSuit) p+=100; else if(s!==ls) p=0;
      if(p>hi){hi=p;winS=i;}
    }
    const tens=played.filter(c=>c.startsWith('10'));
    const pm=d.mindis||{};
    const accM={}; for(let i=0;i<6;i++) accM['slot'+i]=toArr(pm['slot'+i]);
    accM['slot'+winS]=[...accM['slot'+winS],...tens];
    const tA=accM.slot0.length+accM.slot2.length+accM.slot4.length;
    const tB=accM.slot1.length+accM.slot3.length+accM.slot5.length;
    const pt=d.totalTricksWon||{};
    const empty={slot0:'',slot1:'',slot2:'',slot3:'',slot4:'',slot5:''};
    if(tA+tB===4){
      const trA=(pt.slot0||0)+(pt.slot2||0)+(pt.slot4||0)+([0,2,4].includes(winS)?1:0);
      const trB=(pt.slot1||0)+(pt.slot3||0)+(pt.slot5||0)+([1,3,5].includes(winS)?1:0);
      let scA=d.matchScore?.A||0,scB=d.matchScore?.B||0,winMsg,reason;
      if(tA===4){scA++;winMsg='TEAM A WINS!';reason='All 4 Mindis captured!';}
      else if(tB===4){scB++;winMsg='TEAM B WINS!';reason='All 4 Mindis captured!';}
      else{winMsg='DRAW';reason=`Mindis ${tA}–${tB} · Tricks ${trA}–${trB}`;}
      await gameRef.update({matchScore:{A:scA,B:scB},started:false,dealer:(d.dealer+1)%6,hands:{slot0:[],slot1:[],slot2:[],slot3:[],slot4:[],slot5:[]},mindis:{slot0:[],slot1:[],slot2:[],slot3:[],slot4:[],slot5:[]},totalTricksWon:{slot0:0,slot1:0,slot2:0,slot3:0,slot4:0,slot5:0},hukmRevealed:false,hukmCard:'',hukmSuit:'',leadSuit:'',currentTrick:empty,roundResult:{active:true,winner:winMsg,reason}});
      setTimeout(()=>gameRef.child('roundResult/active').set(false),5000);
    } else {
      await gameRef.update({[`mindis/slot${winS}`]:accM['slot'+winS],[`totalTricksWon/slot${winS}`]:(pt['slot'+winS]||0)+1,turn:winS,leadSuit:'',currentTrick:empty});
    }
    isProcessing=false;
  } catch(e){ console.error(e); isProcessing=false; }
}
 
async function resetMatch(){ if(confirm("Reset match?")){ await gameRef.remove(); location.reload(); } }
async function clearDatabase(){ if(confirm("Delete ALL data?")){ await gameRef.remove(); sessionStorage.removeItem('mindi_uid'); location.reload(); } }
async function clearDatabaseFromLobby(){ if(confirm("Clear table?")){ await gameRef.remove(); sessionStorage.removeItem('mindi_uid'); myId='u'+Math.random().toString(36).substr(2,9); sessionStorage.setItem('mindi_uid',myId); location.reload(); } }
 
(async()=>{
  const d=(await gameRef.once('value')).val();
  if(d?.players) for(let i=0;i<6;i++){
    if(d.players['slot'+i]?.id===myId){ mySlot=i; document.getElementById('lobby').style.display='none'; sync(); return; }
  }
})();
</script>
