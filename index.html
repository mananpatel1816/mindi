<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:,">
<title>Mindi - Game Pigeon Edition</title>
<style>
  :root{--bg:#0a2e1a;--accent:#f6c85f;--card-w:75px;--card-h:110px}
  body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);color:white;overflow:hidden;height:100vh}
  
  /* Table Layout */
  .game-container { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #1a5e3a 0%, #0a2e1a 100%); display: flex; align-items: center; justify-content: center; }
  
  .player-box { position: absolute; padding: 12px; text-align: center; background: rgba(0,0,0,0.5); border-radius: 15px; min-width: 120px; border: 2px solid rgba(255,255,255,0.1); transition: 0.3s; }
  .active-turn { border-color: var(--accent); box-shadow: 0 0 20px var(--accent); background: rgba(246,200,95,0.2); }
  
  /* Positions Like Game Pigeon */
  .pos-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
  .pos-top { top: 20px; left: 50%; transform: translateX(-50%); }
  .pos-left { left: 20px; top: 50%; transform: translateY(-50%); }
  .pos-right { right: 20px; top: 50%; transform: translateY(-50%); }

  /* Center Area */
  .table-center { width: 320px; height: 320px; border: 2px dashed rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .played-card { position: absolute; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

  /* Cards Style */
  .card { width: var(--card-w); height: var(--card-h); background: white; color: black; border-radius: 10px; font-weight: bold; font-size: 1.3rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8px; cursor: pointer; user-select: none; border: 1px solid #ccc; position: relative; }
  .card.red { color: #d00; }
  .card .suit-big { font-size: 2.5rem; }
  .card:hover { transform: translateY(-15px); z-index: 200; }
  .card.selected { border: 4px solid #2979ff; transform: translateY(-25px); box-shadow: 0 10px 25px rgba(41,121,255,0.5); }

  .my-hand { display: flex; gap: -20px; max-width: 95vw; padding: 20px; justify-content: center; }
  .my-hand .card { margin-left: -15px; } /* Fanned effect */

  /* Overlay UI */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .btn { background: var(--accent); color: black; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
  .btn:hover { transform: scale(1.05); }
  .hidden { display: none !important; }
  .version-tag { position: fixed; bottom: 10px; right: 20px; font-size: 4rem; font-weight: 900; color: #ff4444; opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>

<div id="lobbyOverlay" class="overlay">
  <h1 style="font-size: 3rem; margin-bottom: 10px;">MINDI</h1>
  <p style="color: #9aa6b2; margin-bottom: 30px;">Multiplayer Global Session</p>
  <input id="userName" placeholder="Enter Your Name" style="padding:15px; border-radius:10px; margin-bottom:20px; width:280px; border:none; font-size: 1.1rem;"/>
  <button class="btn" onclick="enterGame()">JOIN TABLE</button>
  <button onclick="resetDB()" style="margin-top:40px; background:none; color:#666; border:1px solid #333; cursor:pointer; padding:8px 15px; border-radius:8px">Emergency Reset</button>
</div>

<div class="game-container">
  <div id="pTop" class="player-box pos-top">Waiting...</div>
  <div id="pLeft" class="player-box pos-left">Waiting...</div>
  <div id="pRight" class="player-box pos-right">Waiting...</div>
  
  <div class="table-center">
    <div id="playedCardsArea"></div>
    <div id="gameStatus" style="position:absolute; top:-50px; width:300px; text-align:center; font-weight:bold; color:var(--accent); font-size: 1.2rem; text-shadow: 0 2px 4px black"></div>
    <button id="startBtn" class="btn hidden" onclick="startMatch()">DEAL CARDS</button>
  </div>

  <div class="pos-bottom">
    <div id="pBottom" class="player-box" style="position:static; margin:0 auto 15px auto; background: var(--accent); color: black;">YOU</div>
    <div id="hand" class="my-hand"></div>
    <div style="text-align:center; margin-top:15px;">
        <button class="btn" onclick="playCard()">PLAY CARD</button>
    </div>
  </div>
</div>

<div class="version-tag">MANAN</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK-6sMXTdm__ptjxE9sae3eSePt-9OaZg",
  authDomain: "mindi-game-93625.firebaseapp.com",
  databaseURL: "https://mindi-game-93625-default-rtdb.firebaseio.com",
  projectId: "mindi-game-93625",
  storageBucket: "mindi-game-93625.firebasestorage.app",
  messagingSenderId: "432897237762",
  appId: "1:432897237762:web:c48c42f7bd63bfeab7d81b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('global_match');
let myId = 'u_' + Math.random().toString(36).substring(2, 7);
let mySlot = null;

async function resetDB() { 
    await gameRef.set({
        started:false, 
        players:{slot0:{id:null},slot1:{id:null},slot2:{id:null},slot3:{id:null}},
        discard: [],
        log: ["Board Reset"]
    }); 
    location.reload();
}

async function enterGame() {
    const name = document.getElementById('userName').value.trim() || "Player";
    const snap = await gameRef.once('value');
    let data = snap.val();
    
    if(!data || !data.players) { await resetDB(); return; }

    let slot = -1;
    for(let i=0; i<4; i++) { if(!data.players['slot'+i].id) { slot = i; break; } }
    if(slot === -1) return alert("Table is full! Use Emergency Reset.");

    mySlot = slot;
    await gameRef.child('players/slot'+mySlot).set({id:myId, name:name});
    document.getElementById('lobbyOverlay').classList.add('hidden');
    listen();
}

function listen() {
    gameRef.on('value', snap => {
        const data = snap.val();
        if(!data) return;

        // Logic to rotate names so YOU are always at the bottom
        const getPos = (s) => {
            const rel = (s - mySlot + 4) % 4;
            return ['pBottom', 'pRight', 'pTop', 'pLeft'][rel];
        };

        for(let i=0; i<4; i++) {
            const p = data.players['slot'+i];
            const el = document.getElementById(getPos(i));
            if(el) {
                el.innerHTML = `<strong>${p.name || 'Empty'}</strong>`;
                el.classList.toggle('active-turn', data.turn === i && data.started);
            }
        }

        document.getElementById('startBtn').classList.toggle('hidden', !(mySlot === 0 && !data.started));
        document.getElementById('gameStatus').textContent = data.started ? `Turn: ${data.players['slot'+data.turn].name}` : "Waiting for amaa to deal...";

        // Center Table Cards
        const table = document.getElementById('playedCardsArea');
        table.innerHTML = '';
        if(data.discard) {
            data.discard.slice(-4).forEach((c, idx) => {
                const cardEl = createCardEl(c);
                cardEl.classList.add('played-card');
                cardEl.style.transform = `translate(${(idx-2)*15}px, ${(idx-2)*5}px) rotate(${idx*10-15}deg)`;
                table.appendChild(cardEl);
            });
        }

        // Your Hand
        const handDiv = document.getElementById('hand');
        handDiv.innerHTML = '';
        const myCards = (data.hands && data.hands['slot'+mySlot]) || [];
        myCards.forEach((c, idx) => {
            const el = createCardEl(c);
            el.onclick = () => {
                document.querySelectorAll('#hand .card').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected'); el.dataset.val = c; el.dataset.idx = idx;
            };
            handDiv.appendChild(el);
        });
    });
}

function createCardEl(c) {
    const el = document.createElement('div');
    const suit = c.slice(-1);
    const val = c.slice(0, -1);
    const symbols = {H:'♥', D:'♦', S:'♠', C:'♣'};
    el.className = `card ${'HD'.includes(suit) ? 'red' : ''}`;
    el.innerHTML = `<div style="align-self:flex-start">${val}</div><div class="suit-big">${symbols[suit]}</div><div style="align-self:flex-end; transform:rotate(180deg)">${val}</div>`;
    return el;
}

async function startMatch() {
    const suits = ['S','H','D','C'], ranks = ['A','K','Q','J','10','9','8','7','6','5','4','3'];
    let deck = [];
    suits.forEach(s => ranks.forEach(r => deck.push(r+s)));
    deck.sort(() => Math.random() - 0.5);
    
    const hands = {};
    for(let i=0; i<4; i++) hands['slot'+i] = deck.splice(0, 13);
    
    // Safety check: ensure we have a card for the discard pile
    const firstDiscard = deck.length > 0 ? [deck.pop()] : ['AS'];

    await gameRef.update({
        started: true, 
        turn: 0, 
        hands: hands, 
        discard: firstDiscard,
        deck: deck
    });
}

async function playCard() {
    const sel = document.querySelector('#hand .card.selected');
    if(!sel) return alert("Select a card!");
    const snap = await gameRef.once('value');
    const d = snap.val();
    if(d.turn !== mySlot) return;

    const card = sel.dataset.val;
    const h = d.hands['slot'+mySlot];
    h.splice(sel.dataset.idx, 1);
    const disc = d.discard || [];
    disc.push(card);

    await gameRef.update({
        [`hands/slot${mySlot}`]: h,
        discard: disc,
        turn: (d.turn + 1) % 4
    });
}
</script>
</body>
</html>
