<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Mindi - iPhone Pro Edition</title>
<style>
  :root { --green: #1a5e3a; --dark: #050c1a; --gold: #f6c85f; --card-w: 70px; --card-h: 100px; }
  body { margin:0; font-family: -apple-system, sans-serif; background: var(--dark); color: white; overflow: hidden; height: 100vh; touch-action: manipulation; }
  .felt { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #2d8a57 0%, #1a5e3a 100%); overflow: hidden; }

  /* Hamburger Menu */
  #menu-toggle { position: fixed; top: 15px; right: 15px; z-index: 1000; background: rgba(0,0,0,0.6); border: 1px solid var(--gold); border-radius: 5px; padding: 10px; cursor: pointer; }
  #menu-toggle span { width: 22px; height: 2px; background: var(--gold); display: block; margin: 4px 0; }
  
  .scoreboard { position: fixed; top: 70px; right: 15px; background: rgba(0,0,0,0.95); padding: 15px; border-radius: 12px; border: 1.5px solid var(--gold); z-index: 999; min-width: 200px; display: none; }
  .score-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .score-val { color: var(--gold); font-weight: bold; font-size: 1.3rem; }

  /* Player Positions */
  .player-wrapper { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 10; width: 110px; }
  .player { background: rgba(0,0,0,0.8); padding: 6px; border-radius: 12px; border: 1px solid #555; font-size: 0.8rem; width: 100%; text-align: center; }
  .active { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); }
  
  .top { top: 60px; left: 50%; transform: translateX(-50%); }
  .bottom { bottom: 280px; left: 50%; transform: translateX(-50%); }
  .left { left: 10px; top: 40%; transform: translateY(-50%); }
  .right { right: 10px; top: 40%; transform: translateY(-50%); }

  /* Card UI with Corner Info */
  .card { width: var(--card-w); height: var(--card-h); background: white; color: black; border-radius: 8px; border: 1px solid #444; position: relative; box-shadow: 2px 2px 10px rgba(0,0,0,0.4); pointer-events: auto; flex-shrink: 0; }
  .card .corner { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 2px; }
  .card .top-left { top: 2px; left: 2px; }
  .card .bot-right { bottom: 2px; right: 2px; transform: rotate(180deg); }
  .card .suit-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; }
  .card .rank { font-size: 1.1rem; font-weight: 900; }
  .card .suit-mini { font-size: 0.9rem; }
  .red { color: #d00; }

  /* Playing Area */
  .slot-card { position: absolute; transition: 0.3s ease-out; width: var(--card-w); height: var(--card-h); }
  .c-top { top: 180px; left: 50%; transform: translateX(-50%); }
  .c-bottom { bottom: 380px; left: 50%; transform: translateX(-50%); }
  .c-left { left: 100px; top: 40%; transform: translateY(-50%); }
  .c-right { right: 100px; top: 40%; transform: translateY(-50%); }

  /* Hand Area */
  .controls { position: fixed; bottom: 0; width: 100%; padding-bottom: 50px; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 1000; }
  .btn { pointer-events: auto; background: var(--gold); color: black; border: none; padding: 18px 50px; border-radius: 40px; font-weight: 900; font-size: 1.2rem; box-shadow: 0 5px 20px rgba(0,0,0,0.6); margin-bottom: 20px; }
  .btn:disabled { background: #444; color: #777; }

  .my-hand { pointer-events: auto; display: flex; width: 95%; justify-content: center; height: 120px; }
  .my-hand .card { margin-left: -45px; transition: transform 0.2s; }
  .my-hand .card:first-child { margin-left: 0; }
  .my-hand .card.selected { transform: translateY(-40px); z-index: 500 !important; border: 3px solid #007bff; }

  .hukm-indicator { position: fixed; top: 15px; left: 15px; z-index: 200; }
  .hukm-card { width: 45px; height: 65px; background: #900; border: 2px solid #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: white; font-weight: bold; }
  .overlay { position: fixed; inset: 0; background: var(--dark); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="lobby" class="overlay">
  <h1 style="color:var(--gold)">MINDI</h1>
  <input id="userName" placeholder="Your Name" style="padding:15px; border-radius:10px; width:240px; margin-bottom:15px; font-size:1.1rem;" />
  <button class="btn" onclick="joinGame()">JOIN TABLE</button>
</div>

<div id="menu-toggle" onclick="toggleScoreboard()">
  <span></span><span></span><span></span>
</div>

<div class="scoreboard" id="scorePanel">
  <div class="score-row"><span>Adi & Manan</span><span id="score-a" class="score-val">0</span></div>
  <div class="score-row"><span>Opponents</span><span id="score-b" class="score-val">0</span></div>
  <button style="width:100%; padding:10px; margin-top:10px;" onclick="callMutualDraw()">RESET</button>
</div>

<div class="felt">
  <div class="hukm-indicator"><div id="hukm-box" class="hukm-card">M</div></div>
  <button id="dealBtn" class="btn" style="position:absolute; top:45%; left:50%; transform:translateX(-50%); z-index:2100; display:none;" onclick="dealNewGame()">DEAL</button>

  <div id="w-top" class="player-wrapper top"><div id="p-top" class="player">...</div></div>
  <div id="w-left" class="player-wrapper left"><div id="p-left" class="player">...</div></div>
  <div id="w-right" class="player-wrapper right"><div id="p-right" class="player">...</div></div>
  <div id="w-bottom" class="player-wrapper bottom"><div id="p-bottom" class="player">YOU</div></div>

  <div id="table-slots">
    <div id="slot-top" class="slot-card c-top"></div><div id="slot-bottom" class="slot-card c-bottom"></div>
    <div id="slot-left" class="slot-card c-left"></div><div id="slot-right" class="slot-card c-right"></div>
  </div>

  <div class="controls">
    <button id="playBtn" class="btn" onclick="handlePlay()">PLAY CARD</button>
    <div id="hand-list" class="my-hand"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK-6sMXTdm__ptjxE9sae3eSePt-9OaZg",
  authDomain: "mindi-game-93625.firebaseapp.com",
  databaseURL: "https://mindi-game-93625-default-rtdb.firebaseio.com",
  projectId: "mindi-game-93625",
  storageBucket: "mindi-game-93625.firebasestorage.app",
  messagingSenderId: "432897237762",
  appId: "1:432897237762:web:c48c42f7bd63bfeab7d81b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref('mindi_v27_final_pro');

// REFRESH PERSISTENCE
let myId = localStorage.getItem('mindi_id_v27') || ('u' + Math.floor(Math.random()*1000000));
localStorage.setItem('mindi_id_v27', myId);
let mySlot = null;

function toggleScoreboard() {
  const p = document.getElementById('scorePanel');
  p.style.display = (p.style.display === 'block') ? 'none' : 'block';
}

async function joinGame() {
    const name = document.getElementById('userName').value || "Player";
    const snap = await gameRef.once('value');
    let d = snap.val();
    if(!d) {
        await gameRef.set({ started: false, dealer: 0, matchScore: {A:0, B:0}, players: { slot0:{id:""}, slot1:{id:""}, slot2:{id:""}, slot3:{id:""} } });
        d = (await gameRef.once('value')).val();
    }
    let slot = -1;
    for(let i=0; i<4; i++) {
        if(d.players['slot'+i].id === myId) { slot = i; break; }
        if(slot === -1 && !d.players['slot'+i].id) slot = i;
    }
    mySlot = slot;
    await gameRef.child('players/slot'+slot).set({id: myId, name: name});
    document.getElementById('lobby').style.display = 'none';
    sync();
}

// Auto-join if ID exists in database
(async () => {
    const snap = await gameRef.once('value');
    const d = snap.val();
    if(d && d.players) {
        for(let i=0; i<4; i++) {
            if(d.players['slot'+i].id === myId) {
                mySlot = i;
                document.getElementById('lobby').style.display = 'none';
                sync(); break;
            }
        }
    }
})();

function sync() {
    gameRef.on('value', snap => {
        const d = snap.val(); if(!d) return;
        document.getElementById('score-a').innerText = d.matchScore?.A || 0;
        document.getElementById('score-b').innerText = d.matchScore?.B || 0;

        const getPos = (s) => { 
            const rel = (s - mySlot + 4) % 4; 
            return ['bottom', 'left', 'top', 'right'][rel]; 
        };

        let playerCount = 0;
        for(let i=0; i<4; i++) {
            const pos = getPos(i); const p = d.players['slot'+i];
            if(p.id) playerCount++;
            document.getElementById('p-'+pos).innerHTML = `<strong>${p.name || 'Empty'}</strong>${d.dealer===i?' (D)':''}`;
            document.getElementById('p-'+pos).classList.toggle('active', d.turn === i && d.started);
            
            const sEl = document.getElementById('slot-'+pos);
            if(!d.currentTrick?.['slot'+i]) sEl.innerHTML = '';
            else if(!sEl.innerHTML) sEl.appendChild(createCardUI(d.currentTrick['slot'+i]));
        }

        if(d.hukmRevealed) {
            document.getElementById('hukm-box').innerHTML = '';
            document.getElementById('hukm-box').appendChild(createCardInner(d.hukmCard));
        } else { document.getElementById('hukm-box').innerHTML = "M"; }

        document.getElementById('dealBtn').style.display = (mySlot === d.dealer && !d.started && playerCount === 4) ? 'block' : 'none';
        document.getElementById('playBtn').disabled = (d.turn !== mySlot);

        const hand = document.getElementById('hand-list'); hand.innerHTML = '';
        (d.hands?.['slot'+mySlot] || []).forEach((c, idx) => {
            const el = createCardUI(c);
            el.onclick = () => {
                document.querySelectorAll('.my-hand .card').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected'); el.dataset.val = c; el.dataset.idx = idx;
            };
            hand.appendChild(el);
        });
    });
}

function createCardInner(c) {
    const suit = c.slice(-1), val = c.slice(0, -1);
    const syms = {H:'♥', D:'♦', S:'♠', C:'♣'};
    const isRed = 'HD'.includes(suit) ? 'red' : '';
    const container = document.createElement('div');
    container.className = isRed;
    container.style.display = 'contents';
    container.innerHTML = `
        <div class="corner top-left"><span class="rank">${val}</span><span class="suit-mini">${syms[suit]}</span></div>
        <div class="suit-center">${syms[suit]}</div>
        <div class="corner bot-right"><span class="rank">${val}</span><span class="suit-mini">${syms[suit]}</span></div>`;
    return container;
}

function createCardUI(c) {
    const el = document.createElement('div'); el.className = 'card';
    if(c) el.appendChild(createCardInner(c));
    return el;
}

async function dealNewGame() {
    const suits = ['S','H','D','C'], ranks = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
    let deck = []; suits.forEach(s => ranks.forEach(r => deck.push(r+s)));
    deck.sort(() => Math.random() - 0.5);
    const hands = {}; for(let i=0; i<4; i++) hands['slot'+i] = deck.splice(0, 13);
    const snap = await gameRef.once('value'); const d = snap.val();
    const hCard = hands['slot'+d.dealer][Math.floor(Math.random()*13)];
    await gameRef.update({ started: true, turn: (d.dealer + 1) % 4, hands: hands, currentTrick: {slot0:"", slot1:"", slot2:"", slot3:""}, hukmCard: hCard, hukmSuit: hCard.slice(-1), hukmRevealed: false, leadSuit: "", mindis: {slot0:[], slot1:[], slot2:[], slot3:[]} });
}

async function handlePlay() {
    const sel = document.querySelector('.selected'); if(!sel) return;
    const snap = await gameRef.once('value'); const d = snap.val();
    const card = sel.dataset.val;
    if(d.leadSuit && !card.endsWith(d.leadSuit)) {
        if(d.hands['slot'+mySlot].some(c => c.endsWith(d.leadSuit))) return alert("Follow Suit!");
        if(!d.hukmRevealed && (mySlot !== d.dealer || d.hands['slot'+mySlot].length === 1)) {
            if(confirm("Reveal Hukm?")) await gameRef.update({ hukmRevealed: true });
        }
    }
    const h = d.hands['slot'+mySlot]; h.splice(sel.dataset.idx, 1);
    const trick = d.currentTrick || {}; trick['slot'+mySlot] = card;
    let updates = { [`hands/slot${mySlot}`]: h, currentTrick: trick, turn: (d.turn + 1) % 4 };
    if(!d.leadSuit) updates.leadSuit = card.slice(-1);
    const played = Object.values(trick).filter(c => c !== "");
    if(played.length === 4) {
        const rankMap = {'A':14,'K':13,'Q':12,'J':11,'10':10,'9':9,'8':8,'7':7,'6':6,'5':5,'4':4,'3':3,'2':2};
        let winS = 0, hi = -1;
        for(let i=0; i<4; i++) {
            const c = trick['slot'+i], s = c.slice(-1), r = c.slice(0,-1);
            let p = rankMap[r];
            if(s === d.hukmSuit && d.hukmRevealed) p += 100; else if(s !== d.leadSuit) p = 0;
            if(p > hi) { hi = p; winS = i; }
        }
        const tens = played.filter(c => c.startsWith('10'));
        if(tens.length > 0) updates[`mindis/slot${winS}`] = [...(d.mindis?.[`slot${winS}`] || []), ...tens];
        updates.turn = winS; updates.leadSuit = "";
        if(h.length === 0) { 
            let totalA = (d.mindis?.slot0?.length || 0) + (d.mindis?.slot2?.length || 0) + (winS % 2 === 0 ? tens.length : 0);
            let totalB = (d.mindis?.slot1?.length || 0) + (d.mindis?.slot3?.length || 0) + (winS % 2 !== 0 ? tens.length : 0);
            let scA = d.matchScore.A, scB = d.matchScore.B;
            if(totalA === 4) scA++; else if (totalB === 4) scB++;
            updates.matchScore = { A: scA, B: scB }; updates.started = false; updates.dealer = (d.dealer + 1) % 4; 
        }
        setTimeout(() => gameRef.update(updates), 1000);
    } else { await gameRef.update(updates); }
}

async function callMutualDraw() {
    if(!confirm("Reset table?")) return;
    await gameRef.update({ started: false, currentTrick: null, hands: null, hukmRevealed: false });
}
</script>
</body>
</html>
